name: Set symbols

# Keeps a copy of the set symbols in git (app/src/main/assets/set_symbols), so builds still work
# when pokemontcg.io is down: they try a fresh download first and fall back to this copy.
# Runs weekly, when the download script changes, or manually.
on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths: [.github/scripts/fetch-set-symbols.py, .github/workflows/set-symbols.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: set-symbols

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download set symbols
        run: |
          python3 -m pip install --quiet pillow
          python3 .github/scripts/fetch-set-symbols.py app/src/main/assets/set_symbols --min 100

      - name: Commit changes
        run: |
          git add app/src/main/assets/set_symbols
          if git diff --cached --quiet; then echo "Set symbols unchanged."; exit 0; fi
          git diff --cached --stat | tail -1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update set symbols [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
