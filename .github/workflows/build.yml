name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PappVersion=0.0.0 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Report errors as annotations
        if: failure()
        run: .github/scripts/annotate-errors.sh build.log

      - uses: actions/upload-artifact@v4
        with:
          name: PKMrec-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
