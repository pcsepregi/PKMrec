name: Release

# A release is published when the VERSION file changes on main (or when run manually).
# The workflow creates the vX.Y.Z tag and the GitHub release itself.
# Release notes come from the matching "## X.Y.Z" section of CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Invalid VERSION: $VERSION"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        if: env.SKIP != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP != 'true'
        with:
          gradle-version: "8.14.3"

      - name: "Signing: SIGNING_KEYSTORE_BASE64 secret is set"
        if: env.SKIP != 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "length: ${#SIGNING_KEYSTORE_BASE64}"
          [ -n "$SIGNING_KEYSTORE_BASE64" ]

      - name: "Signing: SIGNING_PASSWORD secret is set"
        if: env.SKIP != 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "length: ${#SIGNING_PASSWORD}"
          [ -n "$SIGNING_PASSWORD" ]

      - name: "Signing: decode keystore"
        if: env.SKIP != 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          # Tolerate spaces / line breaks introduced when pasting the secret.
          CLEAN="$(printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]')"
          echo "::notice::keystore secret: ${#CLEAN} chars, starts '${CLEAN:0:6}', ends '${CLEAN: -6}', invalid chars: $(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)"
          printf '%s' "$CLEAN" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: "Signing: keystore opens with SIGNING_PASSWORD"
        if: env.SKIP != 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          PASS="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')"
          keytool -list -keystore "$SIGNING_KEYSTORE_PATH" -storepass "$PASS" -alias pkmrec > /dev/null
          echo "::add-mask::$PASS"
          echo "SIGNING_PASSWORD_CLEAN=$PASS" >> "$GITHUB_ENV"

      - name: Unit tests
        if: env.SKIP != 'true'
        run: gradle --no-daemon testReleaseUnitTest -PappVersion="$VERSION"

      - name: Build signed release APK
        if: env.SKIP != 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_PASSWORD_CLEAN }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_PASSWORD_CLEAN }}
          SIGNING_KEY_ALIAS: pkmrec
        run: gradle --no-daemon assembleRelease -PappVersion="$VERSION"

      - name: Prepare release assets
        if: env.SKIP != 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PKMrec-$VERSION.apk"
          (cd dist && sha256sum "PKMrec-$VERSION.apk" > "PKMrec-$VERSION.apk.sha256" && cat "PKMrec-$VERSION.apk.sha256")
          # Release notes: the "## $VERSION" section of CHANGELOG.md
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/./,$!d' > notes.md
          [ -s notes.md ] || echo "PKMrec $VERSION" > notes.md
          cat notes.md

      - name: Publish GitHub release
        if: env.SKIP != 'true'
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "PKMrec $VERSION" \
            --notes-file notes.md
